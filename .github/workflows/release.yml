name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: GTK and pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --bins

      - name: Package
        run: |
          mkdir dist
          cp target/release/airfork target/release/airfork-gui README.md LICENSE install.sh dist/
          mkdir -p dist/scripts dist/screenshots
          cp scripts/99-airfork-wifi dist/scripts/
          cp screenshots/gui-cropped.png dist/screenshots/
          tar -czf "airfork-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "airfork-${GITHUB_REF_NAME}.tar.gz" --generate-notes
